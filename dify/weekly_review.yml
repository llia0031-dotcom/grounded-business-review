app:
  description: 合成的到店团购数据：每周监控、按维度拆解、写周报，数字逐个核对，对不上不放行。
  icon: 📈
  icon_background: '#E4FBCC'
  mode: workflow
  name: 有据经营分析周报
  use_icon_as_answer_icon: false
dependencies: []
